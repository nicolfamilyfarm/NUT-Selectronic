<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Selectronic SP PRO to NUT workflow</title>
  <desc id="desc">The Selectronic inverter sends local JSON to the container program, which publishes a virtual NUT UPS consumed by Home Assistant, NUT Web Monitor, and NUT monitor clients.</desc>
  <defs>
    <linearGradient id="source" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="service" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="client" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <style>
      .heading { font-family: sans-serif; font-size: 20px; font-weight: 700; fill: white; }
      .source-heading { font-size: 22px; }
      .body { font-family: sans-serif; font-size: 16px; font-weight: 500; fill: white; }
      .small { font: 500 16px sans-serif; fill: #334155; }
      .title { font: 700 30px sans-serif; fill: #0f172a; }
      .arrow-label { font: 600 16px sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="1400" height="620" fill="#f8fafc"/>
  <text x="700" y="55" text-anchor="middle" class="title">Selectronic SP PRO → virtual NUT UPS workflow</text>
  <text x="700" y="88" text-anchor="middle" class="small">Local JSON telemetry is translated into standard NUT variables for monitoring and automation.</text>

  <g>
    <rect x="55" y="205" rx="18" width="270" height="160" fill="url(#source)" stroke="#0f5250" stroke-width="2"/>
    <text x="190" y="250" text-anchor="middle" class="heading source-heading">Selectronic SP PRO</text>
    <text x="190" y="285" text-anchor="middle" class="body">Inverter / battery / solar</text>
    <text x="190" y="320" text-anchor="middle" class="body">Local HTTP JSON API</text>
  </g>

  <g>
    <rect x="390" y="180" rx="18" width="300" height="210" fill="url(#service)" stroke="#1e40af" stroke-width="2"/>
    <text x="540" y="225" text-anchor="middle" class="heading">Selectronic NUT program</text>
    <text x="540" y="263" text-anchor="middle" class="body">Podman / Docker container</text>
    <text x="540" y="298" text-anchor="middle" class="body">C poller + metadata lookup</text>
    <text x="540" y="333" text-anchor="middle" class="body">Runtime and status logic</text>
    <text x="540" y="368" text-anchor="middle" class="body">Atomic NUT data updates</text>
  </g>

  <g>
    <rect x="755" y="205" rx="18" width="280" height="160" fill="url(#service)" stroke="#1e40af" stroke-width="2"/>
    <text x="895" y="250" text-anchor="middle" class="heading">Virtual NUT UPS</text>
    <text x="895" y="285" text-anchor="middle" class="body">UPS name: selectronic</text>
    <text x="895" y="320" text-anchor="middle" class="body">NUT protocol / TCP 3493</text>
  </g>

  <g>
    <rect x="1110" y="120" rx="16" width="235" height="95" fill="url(#client)" stroke="#5b21b6" stroke-width="2"/>
    <text x="1227" y="160" text-anchor="middle" class="heading">Home Assistant</text>
    <text x="1227" y="190" text-anchor="middle" class="body">NUT integration</text>
    <rect x="1110" y="263" rx="16" width="235" height="95" fill="url(#client)" stroke="#5b21b6" stroke-width="2"/>
    <text x="1227" y="303" text-anchor="middle" class="heading">NUT Web Monitor</text>
    <text x="1227" y="333" text-anchor="middle" class="body">Browser dashboard</text>
    <rect x="1110" y="406" rx="16" width="235" height="95" fill="url(#client)" stroke="#5b21b6" stroke-width="2"/>
    <text x="1227" y="446" text-anchor="middle" class="heading">NUT monitor</text>
    <text x="1227" y="476" text-anchor="middle" class="body">upsmon / client tools</text>
  </g>

  <line x1="325" y1="285" x2="385" y2="285" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="355" y="265" text-anchor="middle" class="arrow-label">JSON</text>
  <line x1="690" y1="285" x2="750" y2="285" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="720" y="265" text-anchor="middle" class="arrow-label">NUT data</text>
  <line x1="1035" y1="285" x2="1060" y2="285" stroke="#475569" stroke-width="4"/>
  <circle cx="1060" cy="285" r="6" fill="#475569"/>
  <text x="1060" y="135" text-anchor="middle" class="arrow-label">NUT clients</text>
  <line x1="1060" y1="167" x2="1060" y2="453" stroke="#475569" stroke-width="4"/>
  <line x1="1060" y1="167" x2="1095" y2="167" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1060" y1="310" x2="1095" y2="310" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1060" y1="453" x2="1095" y2="453" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="700" y="570" text-anchor="middle" class="small">The container is read-only with respect to the inverter API; shutdown actions are governed by each NUT client's upsmon policy.</text>
</svg>
